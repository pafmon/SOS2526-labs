name: CI_CD
on: 
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install dependencies      
        run: npm install
      - name: Build UI      
        run: npm run build
      - name: Test
        run: npm test